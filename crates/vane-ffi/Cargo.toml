[package]
name = "vane-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# M2-08：native 启 zstd-encode（写 stored.bin v2 zstd）；zstd-encode 隐含 zstd-decode（读 v2）。
# M2-11：启 jieba feature（FFI vane_load_dict 需 JiebaDict::load_zstd）；不启 dict-zh
# （词典由 Go embed 运行时注入，不烘焙进 staticlib）。
vane-core = { workspace = true, features = ["zstd-encode", "jieba"] }
serde_json = { workspace = true }

[dev-dependencies]
# M2-11 fix：load_dict 成功路径测试需 vane-dict-zh::DICT_BIN 提供 dict.bin 字节。
vane-dict-zh = { path = "../vane-dict-zh" }
