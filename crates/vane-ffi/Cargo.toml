[package]
name = "vane-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# M2-08：native 启 zstd-encode（写 stored.bin v2 zstd）；zstd-encode 隐含 zstd-decode（读 v2）。
vane-core = { workspace = true, features = ["zstd-encode"] }
