[package]
name = "vane-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# M2-08：wasm 启 zstd-decode（ruzstd 纯 Rust，读 v2 stored.bin）；不启 zstd-encode（zstd-sys C 库不进 wasm）。
# 词典永不进 wasm（红线）：不启 dict-zh。worker feature 启 jieba 算法代码（DAT/HMM/seg，无词典数据），
# 须过 800KB 门禁实测；dict-zh 红线永不启。
vane-core = { workspace = true, features = ["zstd-decode"] }
wasm-bindgen = "0.2"
# web-sys / js-sys optional dep（feature-gated）。
# M2-02 启 opfs（SyncAccessHandle）；M2-03 启 idb；M2-04 启 worker。
# web-sys features 仅启用最小子集（控制体积）。
web-sys = { version = "0.3", optional = true, features = [
    "FileSystemSyncAccessHandle",
    "FileSystemReadWriteOptions",
    "FileSystemFileHandle",
    "FileSystemDirectoryHandle",
    "Storage",
] }
js-sys = { version = "0.3", optional = true }
# M2-04：worker 异步 init（getDirectory/createSyncAccessHandle/fetch/IDB）经 JsFuture。
# 体积预估 +5~15KB gzip（登记 README 全局约束表）。
wasm-bindgen-futures = { version = "0.4", optional = true }
# M2-04：词典 CDN sha256 校验（纯 Rust，wasm32 可用）。
sha2 = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# M2-14：dict_loader 测试需真实 dict.bin（zstd 压缩）验证 sha256 校验语义。
# dev-dependency 不进 wasm 产物（词典永不进 wasm 红线）。
vane-dict-zh = { path = "../vane-dict-zh" }

[features]
default = []
# M2-05：simd128 变体标注（marker feature，core 算法无平台分支，SPEC v1.4 I-5——
# f32 距离三核走 cfg(all(target_arch="wasm32", target_feature="simd128")) 显式 f32x4
# 双路径（v1.4 视为能力开关），其余代码仍靠 -Ctarget-feature=+simd128 启用 LLVM 自动向量化）。
# 双产物由 scripts/build-wasm-variants.sh 用 RUSTFLAGS="-Ctarget-feature=+simd128" 区分，
# 非 cargo feature 门控。本 feature 仅供下游标注/条件编译胶水（如探针日志），不进 core。
simd128 = []
# M2-02：OPFS VFS 后端（SyncAccessHandle，Worker 内同步）。
opfs = ["dep:web-sys", "dep:js-sys"]
# M2-03：IndexedDB 降级 VFS 后端（内存 Vec + 异步 checkpoint，sync best-effort）。
# web-sys IDB 子 features 供 M2-04 Worker 壳层 put/get；IdbVfs 本身不直接调用 IDB API
# （薄层：from_blob 接收 Worker 异步读取的 blob，snapshot 供 Worker 异步 put 回 IDB）。
idb = [
    "dep:web-sys",
    "dep:js-sys",
    "web-sys/IdbDatabase",
    "web-sys/IdbObjectStore",
    "web-sys/IdbTransaction",
]
# jieba 算法代码（DAT/HMM/seg，无词典数据）——vane-core/jieba 的透传 feature。
# 词典数据（dict-zh）红线永不启；jieba 算法代码可进 wasm 须过 800KB 门禁实测。
# worker feature 启用本 feature；单独启用须自行过门禁。
jieba = ["vane-core/jieba"]
# M2-04：Dedicated Worker 壳（postMessage Promise 边界 + init 探针 + 词典加载）。
# 启 jieba 算法代码 + wasm-bindgen-futures + web-sys 浏览器 API + sha2 词典校验 +
# opfs/idb Vfs 后端。dict-zh 红线永不启（词典数据运行时 fetch/内联）。
worker = [
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    "dep:sha2",
    "opfs",
    "idb",
    "jieba",
    "web-sys/Navigator",
    "web-sys/Request",
    "web-sys/RequestInit",
    "web-sys/Response",
    "web-sys/console",
    "web-sys/IdbFactory",
    "web-sys/IdbRequest",
    "web-sys/IdbOpenDbRequest",
    "web-sys/IdbTransactionMode",
    "web-sys/FileSystemGetFileOptions",
]
