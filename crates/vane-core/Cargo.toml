[package]
name = "vane-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib 产出 .wasm 供 wasm32 体积门禁测量（SPEC §13.2-3）；
# rlib 供 native 测试/bench/下游 crate 使用。native cdylib 副产物无害。
crate-type = ["cdylib", "rlib"]

[dependencies]
roaring = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }
rust-stemmers = { workspace = true }
ulid = { workspace = true }
ruzstd = { version = "0.5", optional = true }
# 词典数据包（SPEC §12.3）：dict-zh feature 启用时 Db::open 自动加载预编译 dict.bin。
# 独立 crate，wasm32 构建永不启用（词典永不进 wasm，红线）。
vane-dict-zh = { path = "../vane-dict-zh", optional = true }

[features]
jieba = ["ruzstd"]
# dict-zh：启用 jieba + 捆绑 vane-dict-zh 数据包，Db::open 自动加载词典。
# vane-node 启用此 feature；vane-core 默认不启用（wasm32 check 不涉）。
dict-zh = ["jieba", "dep:vane-dict-zh"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hybrid_search"
harness = false

[[bench]]
name = "batch_add"
harness = false

[[bench]]
name = "cold_start"
harness = false
