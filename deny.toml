# deny.toml
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[bans]
multiple-versions = "warn"
deny = [
    # regex 黑名单只针对 core/wasm 运行时。wasm32-check + check-no-std-fs.sh
    # 双保险守 runtime。regex 实际只经 build-dep（napi-derive-backend,
    # proc-macro，编译期工具不进运行时）与 dev-dep（criterion benchmark）引入。
    # wrappers 限定只有这两个非运行时 crate 可直接依赖 regex；若 regex 将来
    # 经运行时 crate 引入（vane-core/vane-ffi/vane-node 运行时路径），仍被 ban。
    { name = "regex", wrappers = ["napi-derive-backend", "criterion"] },
    { name = "tokio" },
    { name = "prost" },
    { name = "tonic" },
    { name = "openssl" },
    { name = "lindera" },
    { name = "ndarray" },
    { name = "wee_alloc" },
    { name = "dashmap" },
    { name = "parking_lot" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    # NCSA = University of Illinois/NCSA Open Source License（LLVM/libFuzzer 许可证）。
    # libfuzzer-sys v0.4.13 的 license = "(MIT OR Apache-2.0) AND NCSA"——
    # NCSA 是 libFuzzer C++ 库的许可证（OSI approved + FSF Free/Libre）。
    # M4 阶段一 a：vane-fuzz crate 引 libfuzzer-sys，需 allow NCSA。
    # 仅 license 允许，不改 [bans] crate 黑名单语义（regex/tokio/prost/... 仍 ban）。
    "NCSA",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # CDLA-Permissive-2.0 = Community Data License Agreement Permissive 2.0
    # (Linux Foundation). webpki-roots (Mozilla CA bundle, via ureq `tls` →
    # rustls) uses this license. Sidecar HTTP client is rustls-only; do not
    # allow the OpenSSL *license* or the openssl crate.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# cargo-deny 0.18+ 对 allow 列表中未匹配的 license 报 warning（默认 Warn，
# 但 exit code 非 0）。保留前瞻性 allow（未来依赖可能命中），降级为 allow 不阻断。
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
