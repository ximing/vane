[workspace]
members = ["crates/vane-core", "crates/vane-ffi", "crates/vane-node", "crates/vane-dict-zh", "crates/vane-wasm", "crates/vane-fuzz", "crates/vane"]
# vane-fuzz 需 nightly + libfuzzer-sys，stable cargo build/test/clippy 编不了；
# default-members 排除 vane-fuzz，确保 `cargo build`/`cargo test`（不带 --workspace）
# 的默认范围不含 fuzz。`cargo test --workspace` 显式列全部 members，仍需 --exclude
# vane-fuzz（见 .github/workflows/ci.yml test/clippy job）。
default-members = ["crates/vane-core", "crates/vane-ffi", "crates/vane-node", "crates/vane-dict-zh", "crates/vane-wasm", "crates/vane"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Vane Contributors"]

[workspace.dependencies]
vane-core = { path = "crates/vane-core" }
roaring = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.11"
rust-stemmers = "1.2"
ulid = { version = "1", default-features = false }
