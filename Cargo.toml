[workspace]
members = ["crates/vane-core", "crates/vane-ffi", "crates/vane-node", "crates/vane-dict-zh"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Vane Contributors"]

[workspace.dependencies]
vane-core = { path = "crates/vane-core" }
roaring = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.11"
rust-stemmers = "1.2"
ulid = { version = "1", default-features = false }
