name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['website/**', 'docs/plans/docs-site-*.md']
  pull_request:
    paths-ignore: ['website/**', 'docs/plans/docs-site-*.md']
  schedule:
    # M4 §3.2 fuzz-long：每周日 03:00 UTC 触发长跑。注意 schedule 不受 paths-ignore
    # 约束——届时全 workflow（含现有 job）都会跑（public repo CI 免费且可作周度
    # 回归/flaky 检测；fuzz-long 本身用 if 门控只在 schedule/dispatch 跑）。
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt check
        run: cargo fmt --all -- --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (-D warnings)
        # vane-fuzz 需 nightly + libfuzzer-sys，stable clippy 编不了 → --exclude。
        # --exclude 须配 --workspace（否则 cargo 报 "--exclude can only be used
        # together with --workspace"）。default-members 也排除 vane-fuzz，双保险。
        # fuzz 自身的 lint 由 nightly fuzz-smoke job 负责（Phase 6）。
        run: cargo clippy --all-targets --all-features --workspace --exclude vane-fuzz -- -D warnings

  test:
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        # vane-fuzz 是 fuzz crate（#![no_main] + libfuzzer-sys），非普通测试 target，
        # stable cargo test 编不了 → --exclude。fuzz 验证由 nightly fuzz-smoke job 负责。
        run: cargo test --workspace --all-features --exclude vane-fuzz

  recall:
    # SPEC §13.2-1 真实回归门禁：HNSW vs 暴力双路+RRF 基线，
    # 五档选择率（0.1%/1%/10%/50%/99%）× 三模式（vector/text/hybrid）recall@10 ≥0.95。
    # M0 recall.rs 保留作冒烟（trivially 1.0）；recall_regression 为 M1 硬门禁。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run recall smoke (M0)
        run: cargo test --test recall -p vane-core
      - name: Run recall regression gate (M1, §13.2-1)
        run: cargo test --test recall_regression -p vane-core

  wasm32-check:
    # SPEC §13.3：core/wasm 出现 std::fs 即失败（M0 第一天硬门禁）。
    # 不变量 I-5：核心算法零平台分支。M2-01：vane-wasm 同禁 std::fs/std::net/mmap。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check wasm32 (vane-core)
        run: cargo check --target wasm32-unknown-unknown -p vane-core
      - name: cargo check wasm32 (vane-wasm)
        run: cargo check --target wasm32-unknown-unknown -p vane-wasm
      - name: clippy wasm32 (vane-wasm)
        run: cargo clippy --target wasm32-unknown-unknown -p vane-wasm -- -D warnings
      - name: grep 双保险（禁 std::fs/std::net/mmap，覆盖 vane-core + vane-wasm）
        run: bash scripts/check-no-std-fs.sh

  deny:
    # SPEC §13.3 cargo-deny + 依赖黑名单
    # （regex / tokio / prost / tonic / openssl / lindera / ndarray / wee_alloc / dashmap / parking_lot）
    # regex 仅允许 build-dep（napi-derive-backend）与 dev-dep（criterion）经 wrappers 引入，
    # core/wasm 运行时路径引入 regex 仍被 ban（wasm32-check + check-no-std-fs.sh 双保险）。
    needs: wasm32-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        # cargo-deny 0.18.6+ 支持 CVSS 4.0 advisory（RUSTSEC-2026-0073 等），
        # 0.16.4 解析 CVSS 4.0 会崩。pin 0.19.9（0.19.x 最新，2026.06 发布）。
        run: cargo install cargo-deny --locked --version 0.19.9
      - name: cargo deny check
        run: cargo deny check

  corpus-compat:
    # SPEC §13.3 corpus 格式兼容测试：旧版本写出的库必须被新版本打开。
    # 此 job 冻结 M0 段格式——任何格式变更必须保持此测试通过，或 bump
    # FORMAT_VERSION + 提供迁移器/双模读取（SPEC §6.2）。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Corpus compat test
        run: cargo test --test corpus_compat -p vane-core

  cold-start:
    # SPEC §13.1：打开 10 万文档库 <1s；>2s 降级为分级指标
    # （元数据 <1s、首次查询 <3s）。gate 测试生成 10 万 fixture（tempdir，
    # 不提交大 binary）并测两阶段（open+restore / 首次查询）。
    # gate 标 #[ignore]（fixture 生成慢），由本 job 专门 --ignored 运行。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cold-start gate (SPEC §13.1)
        # 用 --release：10 万 HNSW 库构建在 debug profile 下会卡死 30min
        # （jieba-compat/ndcg-wiki 均用 --release，此处对齐）。
        run: cargo test --test cold_start_gate -p vane-core --release -- --ignored --nocapture
      - name: Bench compile check
        run: cargo bench --no-run -p vane-core --bench cold_start

  wasm32-size:
    # SPEC §13.2-3：核心 wasm gzip ≤ 800KB（含 jieba 代码、不含词典）。
    # M2-01：双口径测量——vane-wasm default（真实 deliverable）+ vane-core --export-all（保守上界）。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen
      - name: Check wasm32 gzip size ≤800KB (vane-wasm + vane-core --export-all)
        run: bash scripts/check-wasm-size.sh

  dict-size:
    # SPEC §13.2-3：@vane/dict-zh dict.bin gzip ≤1.5MB；Go embed <2MB（08 deferred）。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check dict size gates
        run: bash scripts/check-dict-size.sh

  dict-hash:
    # SPEC §12.3：三渠道词典版本哈希一致性校验（Go 08 deferred）。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # check-dict-hash.sh 用 xxd -p；ubuntu-latest 默认不含 xxd，预装避免
      # 未来 Go dict hash 文件加入后 xxd 路径失败。
      - name: Install xxd
        run: sudo apt-get install -y xxd
      - name: Check dict hash consistency
        run: bash scripts/check-dict-hash.sh

  jieba-compat:
    # SPEC §13.2-2 ①：jieba-lite 200 句 vs jieba-rs 原版切分 100% 一致。
    # fixture 由 scripts/gen_jieba_fixture.rs 离线生成（jieba-rs 不作 dev-dep）。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run jieba 200-sentence compatibility test
        run: cargo test --test jieba_compat -p vane-core --features dict-zh --release

  ndcg-wiki:
    # SPEC §13.2-2 ②：nDCG@10 jieba-lite vs bigram。
    # M1 合成边界歧义语料（+84% 硬门禁）+ M2 真实维基 corpus（现实鲁棒性）。
    # jieba-rs <2% 差异由 jieba-compat job 200 句 100% 一致覆盖。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run nDCG regression (M1 合成边界歧义语料, +84% 硬门禁)
        run: cargo test --test ndcg_wiki -p vane-core --features dict-zh --release -- --nocapture
      - name: Run nDCG real wiki corpus (M2 真实维基 500 篇)
        run: cargo test --test ndcg_wiki_zh -p vane-core --features dict-zh --release -- --nocapture

  # M2-11：Go cgo 绑定——host 平台 build + test + demo（darwin/arm64 本地可跑）。
  # 远程 CI（ubuntu-latest）需先 cargo build --release -p vane-ffi 再 go build/test。
  go-host:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build vane-ffi staticlib
        run: cargo build --release -p vane-ffi
      - name: Prepare staticlib for cgo (linux-amd64)
        run: |
          mkdir -p bindings/go/lib/linux-amd64
          cp target/release/libvane_ffi.a bindings/go/lib/linux-amd64/
      - name: Go build
        run: cd bindings/go && go build ./...
      - name: Go test
        run: cd bindings/go && go test ./...
      - name: Go demo
        run: cd bindings/go/example && go run main.go

  # M2-11：Go staticlib 4 平台交叉编译矩阵（zig cc，远程 CI 待触发）。
  # SPEC §12.2：zig cc 交叉编译 libvane_ffi.a 到 4 平台。
  # 本地 zig 不可用 → 此 job 仅在远程 CI 触发时执行。
  # 矩阵：x86_64-linux-gnu / aarch64-linux-gnu / x86_64-apple-darwin / aarch64-apple-darwin
  #       (+ x86_64-windows-msvc 作为第 5 平台，使用 zig cc+x86_64-windows-gnu 替代)
  go-cross:
    needs: go-host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # target=Rust triple（CI 实际使用，传给 cargo zigbuild --target + 产物目录）。
          # zig_target=zig-style（仅供未来参考，CI 不再引用）。
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-linux-gnu
            lib_dir: linux-amd64
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-linux-gnu
            lib_dir: linux-arm64
          - target: x86_64-apple-darwin
            zig_target: x86_64-macos
            lib_dir: darwin-amd64
          - target: aarch64-apple-darwin
            zig_target: aarch64-macos
            lib_dir: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Z1 修复（Z0 必炸 #1）：zig 0.13.0 过旧 + cargo-zigbuild 未 pin。
      # pin zig 0.15.2（2025.11 最新 stable）+ cargo-zigbuild 0.23.0
      # （zig 0.15.2 + cargo-zigbuild 0.23.0 是经项目验证的成功配对，覆盖
      #  linux arm64/amd64 + macOS arm64/amd64；0.23.0 较 0.21.4 兼容更稳）。
      # 关键：cargo-zigbuild 的 --target 必须传 Rust triple（matrix.target），
      #  不能传 zig-style target（matrix.zig_target，如 x86_64-linux-gnu）——
      #  cargo 会把 --target 原样转给 rustc，rustc 报 "could not find specification
      #  for target"。cargo-zigbuild 内部按 Rust triple 映射到 zig target。
      #  产物目录也是 Rust triple（target/<triple>/release/）。
      # zig_target 字段保留仅供未来参考，CI 实际用 target。
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.23.0
      - name: Cross-compile vane-ffi staticlib (zig cc)
        run: cargo zigbuild --release -p vane-ffi --target ${{ matrix.target }}
      - name: Verify staticlib produced
        # Z1 修复（改进 6）：移除 || true，改 test -f 断言——产物缺失即失败。
        # 产物目录是 Rust triple（matrix.target），非 zig-style。
        run: |
          test -f target/${{ matrix.target }}/release/libvane_ffi.a
          ls -lh target/${{ matrix.target }}/release/libvane_ffi.a

  wasm-recall:
    # M2-06 §8.4：SIMD/scalar 双变体召回回归（wasm32，node）。
    # 双产物构建（RUSTFLAGS=+simd128 / 默认）+ wasm-bindgen-test-runner 跑
    # 五档×三模式 recall@10≥0.95 + 跨变体 Jaccard≥0.99 硬断言。
    # node v20 支持 simd128（两产物均可在 node 跑）。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127
      - name: Run dual-variant recall regression (simd + scalar + Jaccard)
        run: bash scripts/run-wasm-recall.sh

  # ===========================================================================
  # M4 阶段六 a：5 个新 CI job（fuzz-smoke / fuzz-long / compat / stress /
  # crash-recovery）。前置 Phase 1-5 已就位（vane-fuzz crate + cross_version_compat
  # + stress_concurrency + crash_recovery）。本批只改 ci.yml，不碰源码/SPEC。
  # ===========================================================================

  fuzz-smoke:
    # M4 §3.2 fuzz-smoke：每 target 60s 短跑（push/PR）。nightly + cargo-fuzz
    # （-Z sanitizer）。独立 nightly toolchain，不依赖 test job（stable）——fuzz 是
    # 不同验证维度，并行跑省时。vane-fuzz 不在 default-members，CI 直接到
    # crates/vane-fuzz 跑 cargo fuzz。cron（周日 03:00）由 fuzz-long 深跑覆盖，
    # smoke 不重复 → if: event_name != schedule。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pin nightly（cargo-fuzz 需 -Z sanitizer，stable 不支持）。@master 配
      # toolchain: 输入是 dtolnay/rust-toolchain pin 特定 nightly 的标准用法
      # （@stable/@nightly tag 自选 toolchain，不读 toolchain 输入）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz smoke (60s per target, 5 targets)
        # cargo-fuzz 默认在「非 fuzz」package 下找 fuzz/；workspace 根不是
        # fuzz crate，vane-fuzz 自己才是。必须 --fuzz-dir . 指向本目录。
        run: |
          for target in brute_search_fuzz hnsw_search_fuzz persist_roundtrip_fuzz merge_fuzz dict_load_fuzz; do
            cargo fuzz run --fuzz-dir . $target -- -max_total_time=60 -max_len=4096
          done
        working-directory: crates/vane-fuzz

  fuzz-long:
    # M4 §3.2 fuzz-long：每 target 10min 长跑（cron 周日 03:00 UTC + 手动 dispatch）。
    # nightly + cargo-fuzz，-max_total_time=600 -max_len=65536。|| true 容错——
    # crash 不阻断 job（长跑发现 crash 是预期的，人工分析），但上传 crash artifact。
    # if: always() + if-no-files-found: ignore 保证无 crash 时不上传、不失败。
    # timeout 60min（5 targets × 10min + install/compile overhead）。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz long (10min per target, 5 targets)
        run: |
          for target in brute_search_fuzz hnsw_search_fuzz persist_roundtrip_fuzz merge_fuzz dict_load_fuzz; do
            cargo fuzz run --fuzz-dir . $target -- -max_total_time=600 -max_len=65536 || true
          done
        working-directory: crates/vane-fuzz
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: crates/vane-fuzz/fuzz/artifacts/
          if-no-files-found: ignore

  compat:
    # M4 §3.4 跨版本持久化兼容：当前版本读 v0.1.0 tag 真实 fixture。
    # test job 已跑 cross_version_compat（debug + --all-features）；本 job 加
    # --release 更彻底 + 独立失败信号（cross-version vs same-version round-trip
    # 分离）。取舍：独立 job（非合并 corpus-compat）——DoD 5 job 1:1 映射 +
    # 独立可见性 + --release thoroughness。--all-features 覆盖 zstd-encode 分支
    # （cross_version_compat.rs:335 #[cfg(feature="zstd-encode")] 断言）。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cross-version compat (v0.1.0 fixture, --release)
        run: cargo test --test cross_version_compat -p vane-core --all-features --release

  stress:
    # M4 阶段四 并发压测：stress_concurrency --release + 3 次 multi-run。
    # test job 已跑 stress_concurrency（debug，单次，--all-features）；本 job 加
    # --release + 3 次 multi-run 更彻底（验 release 优化下并发安全 + 降低竞态
    # flaky 漏检）。default features（stress 不需 fault-injection/zstd——并发安全
    # 与存储格式正交）。3 次 multi-run 捕捉低概率竞态。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stress concurrency (--release, 3 multi-runs)
        run: |
          for i in 1 2 3; do
            echo "=== stress run $i/3 ==="
            cargo test --test stress_concurrency -p vane-core --release
          done

  crash-recovery:
    # M4 阶段二 崩溃恢复：crash_recovery 5 场景（meta_slot/WAL/merge/ENOSPC/
    # 部分写，FaultVfs 注入）--release。test job 已跑 crash_recovery（--all-features
    # 含 fault-injection，debug）；本 job 加 --release 更彻底（验 release 优化下
    # 崩溃恢复一致性）。crash_recovery.rs 门控 #![cfg(feature = "fault-injection")]
    # → 须 --features fault-injection。仅 fault-injection（不需 zstd-encode——
    # crash 场景用 v1 stored 格式，本地 --no-run 编译验证通过）。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Crash recovery (5 scenarios, FaultVfs, --release)
        run: cargo test --test crash_recovery -p vane-core --features fault-injection --release
