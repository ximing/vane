name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rustfmt check
        run: cargo fmt --all -- --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace --all-features

  recall:
    # SPEC §13.2-1 真实回归门禁：HNSW vs 暴力双路+RRF 基线，
    # 五档选择率（0.1%/1%/10%/50%/99%）× 三模式（vector/text/hybrid）recall@10 ≥0.95。
    # M0 recall.rs 保留作冒烟（trivially 1.0）；recall_regression 为 M1 硬门禁。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run recall smoke (M0)
        run: cargo test --test recall -p vane-core
      - name: Run recall regression gate (M1, §13.2-1)
        run: cargo test --test recall_regression -p vane-core

  wasm32-check:
    # SPEC §13.3：core/wasm 出现 std::fs 即失败（M0 第一天硬门禁）。
    # 不变量 I-5：核心算法零平台分支。M2-01：vane-wasm 同禁 std::fs/std::net/mmap。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo check wasm32 (vane-core)
        run: cargo check --target wasm32-unknown-unknown -p vane-core
      - name: cargo check wasm32 (vane-wasm)
        run: cargo check --target wasm32-unknown-unknown -p vane-wasm
      - name: clippy wasm32 (vane-wasm)
        run: cargo clippy --target wasm32-unknown-unknown -p vane-wasm -- -D warnings
      - name: grep 双保险（禁 std::fs/std::net/mmap，覆盖 vane-core + vane-wasm）
        run: bash scripts/check-no-std-fs.sh

  deny:
    # SPEC §13.3 cargo-deny + 依赖黑名单
    # （regex / tokio / prost / tonic / openssl / lindera / ndarray / wee_alloc / dashmap / parking_lot）
    # regex 仅允许 build-dep（napi-derive-backend）与 dev-dep（criterion）经 wrappers 引入，
    # core/wasm 运行时路径引入 regex 仍被 ban（wasm32-check + check-no-std-fs.sh 双保险）。
    needs: wasm32-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        # cargo-deny 0.18.6+ 支持 CVSS 4.0 advisory（RUSTSEC-2026-0073 等），
        # 0.16.4 解析 CVSS 4.0 会崩。锁 ^0.19 取最新 0.19.x。
        run: cargo install cargo-deny --locked --version ^0.19
      - name: cargo deny check
        run: cargo deny check

  corpus-compat:
    # SPEC §13.3 corpus 格式兼容测试：旧版本写出的库必须被新版本打开。
    # 此 job 冻结 M0 段格式——任何格式变更必须保持此测试通过，或 bump
    # FORMAT_VERSION + 提供迁移器/双模读取（SPEC §6.2）。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Corpus compat test
        run: cargo test --test corpus_compat -p vane-core

  cold-start:
    # SPEC §13.1：打开 10 万文档库 <1s；>2s 降级为分级指标
    # （元数据 <1s、首次查询 <3s）。gate 测试生成 10 万 fixture（tempdir，
    # 不提交大 binary）并测两阶段（open+restore / 首次查询）。
    # gate 标 #[ignore]（fixture 生成慢），由本 job 专门 --ignored 运行。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cold-start gate (SPEC §13.1)
        run: cargo test --test cold_start_gate -p vane-core -- --ignored --nocapture
      - name: Bench compile check
        run: cargo bench --no-run -p vane-core --bench cold_start

  wasm32-size:
    # SPEC §13.2-3：核心 wasm gzip ≤ 800KB（含 jieba 代码、不含词典）。
    # M2-01：双口径测量——vane-wasm default（真实 deliverable）+ vane-core --export-all（保守上界）。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen
      - name: Check wasm32 gzip size ≤800KB (vane-wasm + vane-core --export-all)
        run: bash scripts/check-wasm-size.sh

  dict-size:
    # SPEC §13.2-3：@vane/dict-zh dict.bin gzip ≤1.5MB；Go embed <2MB（08 deferred）。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dict size gates
        run: bash scripts/check-dict-size.sh

  dict-hash:
    # SPEC §12.3：三渠道词典版本哈希一致性校验（Go 08 deferred）。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dict hash consistency
        run: bash scripts/check-dict-hash.sh

  jieba-compat:
    # SPEC §13.2-2 ①：jieba-lite 200 句 vs jieba-rs 原版切分 100% 一致。
    # fixture 由 scripts/gen_jieba_fixture.rs 离线生成（jieba-rs 不作 dev-dep）。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run jieba 200-sentence compatibility test
        run: cargo test --test jieba_compat -p vane-core --features dict-zh --release

  ndcg-wiki:
    # SPEC §13.2-2 ②：nDCG@10 jieba-lite vs bigram（合成语料降级，报告值不阻断 merge）。
    # jieba-rs <2% 差异由 jieba-compat job 200 句 100% 一致覆盖。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run nDCG regression (合成语料降级)
        run: cargo test --test ndcg_wiki -p vane-core --features dict-zh --release -- --nocapture

  # M2-11：Go cgo 绑定——host 平台 build + test + demo（darwin/arm64 本地可跑）。
  # 远程 CI（ubuntu-latest）需先 cargo build --release -p vane-ffi 再 go build/test。
  go-host:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build vane-ffi staticlib
        run: cargo build --release -p vane-ffi
      - name: Prepare staticlib for cgo (linux-amd64)
        run: |
          mkdir -p bindings/go/lib/linux-amd64
          cp target/release/libvane_ffi.a bindings/go/lib/linux-amd64/
      - name: Go build
        run: cd bindings/go && go build ./...
      - name: Go test
        run: cd bindings/go && go test ./...
      - name: Go demo
        run: cd bindings/go/example && go run main.go

  # M2-11：Go staticlib 4 平台交叉编译矩阵（zig cc，远程 CI 待触发）。
  # SPEC §12.2：zig cc 交叉编译 libvane_ffi.a 到 4 平台。
  # 本地 zig 不可用 → 此 job 仅在远程 CI 触发时执行。
  # 矩阵：x86_64-linux-gnu / aarch64-linux-gnu / x86_64-apple-darwin / aarch64-apple-darwin
  #       (+ x86_64-windows-msvc 作为第 5 平台，使用 zig cc+x86_64-windows-gnu 替代)
  go-cross:
    needs: go-host
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-linux-gnu
            lib_dir: linux-amd64
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-linux-gnu
            lib_dir: linux-arm64
          - target: x86_64-apple-darwin
            zig_target: x86_64-macos
            lib_dir: darwin-amd64
          - target: aarch64-apple-darwin
            zig_target: aarch64-macos
            lib_dir: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.13.0'
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Cross-compile vane-ffi staticlib (zig cc)
        run: cargo zigbuild --release -p vane-ffi --target ${{ matrix.zig_target }}
      - name: Verify staticlib produced
        run: |
          find target/ -name "libvane_ffi.a" -path "*${{ matrix.zig_target }}*" | head -1
          ls -lh target/${{ matrix.zig_target }}/release/libvane_ffi.a || true

  wasm-recall:
    # M2-06 §8.4：SIMD/scalar 双变体召回回归（wasm32，node）。
    # 双产物构建（RUSTFLAGS=+simd128 / 默认）+ wasm-bindgen-test-runner 跑
    # 五档×三模式 recall@10≥0.95 + 跨变体 Jaccard≥0.99 硬断言。
    # node v20 支持 simd128（两产物均可在 node 跑）。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127
      - name: Run dual-variant recall regression (simd + scalar + Jaccard)
        run: bash scripts/run-wasm-recall.sh
