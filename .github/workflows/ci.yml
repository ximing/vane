name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rustfmt check
        run: cargo fmt --all -- --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace --all-features

  recall:
    # SPEC §13.2-1 真实回归门禁：HNSW vs 暴力双路+RRF 基线，
    # 五档选择率（0.1%/1%/10%/50%/99%）× 三模式（vector/text/hybrid）recall@10 ≥0.95。
    # M0 recall.rs 保留作冒烟（trivially 1.0）；recall_regression 为 M1 硬门禁。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run recall smoke (M0)
        run: cargo test --test recall -p vane-core
      - name: Run recall regression gate (M1, §13.2-1)
        run: cargo test --test recall_regression -p vane-core

  wasm32-check:
    # SPEC §13.3：core 出现 std::fs 即失败（M0 第一天硬门禁）。
    # 不变量 I-5：核心算法零平台分支。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo check wasm32
        run: cargo check --target wasm32-unknown-unknown -p vane-core
      - name: grep 双保险（禁 std::fs/std::net/mmap）
        run: bash scripts/check-no-std-fs.sh

  deny:
    # SPEC §13.3 cargo-deny + 依赖黑名单
    # （regex / tokio / prost / tonic / openssl / lindera / ndarray / wee_alloc / dashmap / parking_lot）
    needs: wasm32-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version ^0.16
      - name: cargo deny check
        run: cargo deny check --workspace

  corpus-compat:
    # SPEC §13.3 corpus 格式兼容测试：旧版本写出的库必须被新版本打开。
    # 此 job 冻结 M0 段格式——任何格式变更必须保持此测试通过，或 bump
    # FORMAT_VERSION + 提供迁移器/双模读取（SPEC §6.2）。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Corpus compat test
        run: cargo test --test corpus_compat -p vane-core

  # wasm32-size (DEFERRED — SPEC §13.2-3)：
  # 核心 wasm gzip ≤ 800KB（含 jieba 代码、不含词典）；全功能 ≤ 1.2MB；
  # @vane/dict-zh ≤ 1.5MB；Go embed 增量 < 2MB；500KB 为 M2 优化目标非门禁。
  # 此门禁 M1 jieba 落地起生效，届时补 wasm-opt + gzip size check：
  #   - cargo build --release --target wasm32-unknown-unknown -p vane-core
  #   - wasm-opt -Oz target/wasm32-unknown-unknown/release/vane_core.wasm -o opt.wasm
  #   - gzip -c opt.wasm | wc -c  （断言 ≤ 800*1024）
  # M0 段不依赖 jieba，体积门禁暂不实跑。
