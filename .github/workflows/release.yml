name: release

on:
  push:
    tags:
      - 'v*' # 仅 tag 触发正式发版
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.3.0）'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # SPEC §12.2 M0 Node prebuilt 4 平台（napi-rs，@napi-rs/cli 3.x）。
    # 官方发布流程 build job：per-platform 只 `napi build --target` 产出 .node 并上传，
    # 不在此跑 `napi artifacts`（`napi artifacts` 不支持 `--target`（3.x））。
    # 平台包聚合交给 release job 的 `napi create-npm-dirs` + `napi artifacts`。
    strategy:
      fail-fast: false
      matrix:
        include:
          # triples 与 crates/vane-node/package.json napi.targets 一致（3.x 读 targets，triples 弃用）
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_platform: linux-x64-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            node_platform: darwin-arm64
          # Z1 标注 pre-existing：macos-13（Intel）已于 2025-12 被 GitHub 退役，
          # 替换为 macos-15-intel（2025-09 上线，退役计划 2027 秋，最后一个 x86_64 镜像）。
          - os: macos-15-intel
            target: x86_64-apple-darwin
            node_platform: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_platform: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli@^3
      - name: Build napi prebuilt
        working-directory: crates/vane-node
        run: napi build --target ${{ matrix.target }} --platform --release
      - uses: actions/upload-artifact@v4
        with:
          name: vane-node-${{ matrix.node_platform }}
          path: |
            crates/vane-node/*.node
            crates/vane-node/index.js

  build-go:
    # SPEC §12.2 Go cgo staticlib 4 平台交叉编译（zig cc）。
    # 配置与 ci.yml go-cross job 一致（已 CI 验证）：
    #   zig 0.15.2 + cargo-zigbuild 0.23.0 + Rust triple --target。
    # 产出 libvane_ffi-<lib_dir>.a，发版时作为 GitHub Release asset。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # target=Rust triple（传给 cargo zigbuild --target + 产物目录）。
          # lib_dir=bindings/go/lib/ 子目录名（cgo 约定）。
          - target: x86_64-unknown-linux-gnu
            lib_dir: linux-amd64
          - target: aarch64-unknown-linux-gnu
            lib_dir: linux-arm64
          - target: x86_64-apple-darwin
            lib_dir: darwin-amd64
          - target: aarch64-apple-darwin
            lib_dir: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.23.0
      - name: Cross-compile vane-ffi staticlib (zig cc)
        run: cargo zigbuild --release -p vane-ffi --target ${{ matrix.target }}
      - name: Verify + rename staticlib
        run: |
          test -f target/${{ matrix.target }}/release/libvane_ffi.a
          cp target/${{ matrix.target }}/release/libvane_ffi.a libvane_ffi-${{ matrix.lib_dir }}.a
          ls -lh libvane_ffi-${{ matrix.lib_dir }}.a
      - uses: actions/upload-artifact@v4
        with:
          name: vane-go-${{ matrix.lib_dir }}
          path: libvane_ffi-${{ matrix.lib_dir }}.a

  build-wasm:
    # SPEC §12.2/§13.2-3 浏览器 WASM 双变体（simd128 + scalar）。
    # 复用 scripts/build-wasm-variants.sh（含 wasm-opt -Oz + 体积门禁 gzip ≤800KB）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen
      - name: Build WASM dual variants (simd + scalar)
        run: FEATURES=worker bash scripts/build-wasm-variants.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vane-wasm
          path: |
            target/wasm-variants/vane_wasm_simd.wasm
            target/wasm-variants/vane_wasm_scalar.wasm

  build-web:
    # SPEC §12.2/§13.2-3 @vane-rs/web npm 包构建（wasm-bindgen --target web ESM 双变体 + tsc）。
    # 复用 bindings/web/scripts/build-web.sh：cargo build 双变体（simd128/scalar）+
    # wasm-bindgen --target web 后处理 + wasm-opt -Oz + tsc 编译 src/*.ts → dist/ + 体积门禁 gzip ≤800KB。
    # 产出 bindings/web/dist/ 上传 artifact 供 release job npm publish。
    # 与 build / build-go / build-wasm 并行，无相互依赖。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen
      - name: Install wasm-bindgen-cli
        # 版本对齐 Cargo.lock wasm-bindgen 0.2.127（ci.yml wasm-recall job 同模式）。
        # wasm-bindgen-cli 版本必须 == 编译进 .wasm 的 wasm-bindgen library 版本，否则后处理报版本不匹配。
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web devDeps (typescript)
        working-directory: bindings/web
        run: npm ci
      - name: Build @vane-rs/web (dist/)
        run: bash bindings/web/scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vane-web
          path: bindings/web/dist/

  build-cli:
    # Native sidecar CLI (`crates/vane`). Unix sockets + launchd/systemd --user;
    # first version is macOS + Linux only (no Windows service).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vane-x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: vane-aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: vane-x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build vane CLI
        run: cargo build --release -p vane --target ${{ matrix.target }} --locked
      - name: Package tarball
        run: |
          BIN="target/${{ matrix.target }}/release/vane"
          test -f "$BIN"
          strip "$BIN" || true
          chmod +x "$BIN"
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.artifact }}"
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          ls -lh "${{ matrix.artifact }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: vane-cli-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    # 三端 prebuilt 聚合发布。Node 流水线遵循 napi-rs 官方发布流程
    # （napi.rs/docs/deep-dive/release），与 @napi-rs/cli 3.x 命令一致：
    #   1. 下载 4 平台 .node → 暂存到 crates/vane-node/（napi artifacts 扫描位置）
    #   2. napi create-npm-dirs：为每个 target 创建 npm/<platform>/ 平台包目录 + package.json
    #   3. napi artifacts --output-dir . --npm-dir npm：从 cwd 收集 .node 拷贝到 npm/<platform>/ 与包根
    #   4. npm publish（主包）：prepublishOnly 脚本 `napi pre-publish -t npm` 自动发布
    #      4 个 optionalDeps 平台包 + 上传 .node 到 GitHub Release
    # Go .a + WASM .wasm + vane CLI tarball 由 softprops/action-gh-release 挂到同一 Release。
    # tag 触发：npm publish + GitHub Release。workflow_dispatch：仅构建 + create-npm-dirs +
    # artifacts 收集验证（publish/gh-release 通过 `if: startsWith(github.ref, 'refs/tags/')` 跳过）。
    needs: [build, build-go, build-wasm, build-web, build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli@^3
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage node .node + index.js into crates/vane-node/
        # napi artifacts --output-dir . 从 cwd（crates/vane-node/）扫描 *.node；
        # 将 4 个 per-platform .node 暂存到此目录。
        # index.js 是 napi-rs 生成的平台切换 loader（main.js require './index.js'），
        # 被 .gitignore 忽略不入库，需从 build artifact 暂存（4 平台生成相同文件，取 linux 即可）。
        run: |
          cp artifacts/vane-node-*/*.node crates/vane-node/
          cp artifacts/vane-node-linux-x64-gnu/index.js crates/vane-node/
          ls -lh crates/vane-node/*.node crates/vane-node/index.js
      - name: Stage web dist/ into bindings/web/
        # build-web artifact 上传 dist/ 目录内容到 artifact 根（upload-artifact 对目录取内容），
        # 下载后位于 artifacts/vane-web/。bindings/web/dist/ 被 .gitignore 忽略（checkout 后不存在），
        # 需 mkdir + cp 重建。package.json + README + LICENSE 已由 checkout 提供，不需 artifact 携带。
        run: |
          mkdir -p bindings/web/dist
          cp -r artifacts/vane-web/. bindings/web/dist/
          ls -la bindings/web/dist/
      - name: Create npm platform package dirs
        # 3.x 命令为 `create-npm-dirs`（复数，无 -t flag）；从 package.json napi.targets 读 4 平台，
        # 为每个 target 创建 npm/<platform>/ + package.json（main 指向 vane.<platform>.node，
        # binaryName "vane" 激活；loader index.js 由 napi build 生成再暂存）。
        # 必须在 napi artifacts 之前运行（后者只写文件，不建目录）。
        # working-directory 提供 cwd（crates/vane-node/），--npm-dir 默认 npm。
        working-directory: crates/vane-node
        run: napi create-npm-dirs
      - name: Collect .node into platform packages
        # 3.x napi artifacts 选项：--output-dir,-o,-d（3.x 拒 --dir）+ --npm-dir。
        # --output-dir . 指向 cwd（.node 所在），--npm-dir npm 指向上一步创建的平台包目录。
        # 收集 .node 到 npm/<platform>/ 与包根。
        working-directory: crates/vane-node
        run: napi artifacts --output-dir . --npm-dir npm
      - name: Create GitHub Release + attach Go/WASM/CLI assets
        # Attach CLI tarballs even if a later npm publish fails. softprops updates
        # an existing tag release in place.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vane-go-*/libvane_ffi-*.a
            artifacts/vane-wasm/*.wasm
            artifacts/vane-cli-*/*.tar.gz
      - name: Publish to npm
        # npm publish 主包触发 prepublishOnly 脚本 `napi pre-publish -t npm`（3.x canonical 名）：
        # 更新 optionalDependencies → 逐个 npm publish npm/<platform>/ 平台包 →
        # 上传 .node 到 GitHub Release（需 GITHUB_TOKEN + GITHUB_REPOSITORY，后者 Actions 自动注入）。
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: crates/vane-node
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @vane-rs/dict-zh to npm
        # @vane-rs/dict-zh 纯数据包，非 napi，不需 build job。源目录 data/ + package.json + LICENSE
        # 已在仓库（package.json files：data/dict.bin + data/sha256_prefix.bin + LICENSE）。
        # 顺序（C4 修复）：dict-zh 必须在 @vane-rs/web 之前 publish。web 的 package.json
        # 声明 optionalDependencies: { "@vane-rs/dict-zh": "2026.8.0" }——先发 dict-zh 确保
        # web publish 时 optionalDep 指向已存在的版本；若 dict-zh 失败，step 失败阻塞
        # web publish（保守设计，避免断裂 optionalDep 上线：用户装 web 后中文分词不可用）。
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: crates/vane-dict-zh
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @vane-rs/web to npm
        # @vane-rs/web 非 napi 包，直接 npm publish --access public（package.json publishConfig.access=public 已设）。
        # dist/ 由 build-web artifact 暂存；package.json + README + LICENSE 由 checkout 提供。
        # setup-node registry-url 已在 release job 顶部配置（npm publish 读 ~/.npmrc 认证）。
        # 顺序（C4 修复）：在 @vane-rs/dict-zh publish 之后——dict-zh 是 web 的 optionalDep，
        # 先发依赖包确保 web 上线时 optionalDep 指向已存在版本。
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: bindings/web
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
