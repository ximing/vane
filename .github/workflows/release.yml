name: release

on:
  push:
    tags:
      - 'v*' # 仅 tag 触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0）'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # SPEC §12.2 M0 Node prebuilt 4 平台
          # triples 与 crates/vane-node/napi.config.json 的 additional 一致
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_platform: linux-x64-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            node_platform: darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            node_platform: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_platform: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli
      - name: Build napi prebuilt
        working-directory: crates/vane-node
        run: napi build --target ${{ matrix.target }} --platform --release
      - name: Package artifact
        working-directory: crates/vane-node
        run: napi artifacts --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vane-node-${{ matrix.node_platform }}
          path: |
            crates/vane-node/*.node
            crates/vane-node/*.tgz

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: crates/vane-node/artifacts
      - name: Publish to npm
        working-directory: crates/vane-node
        run: napi publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
