name: release

on:
  push:
    tags:
      - 'v*' # 仅 tag 触发正式发版
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0）'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # SPEC §12.2 M0 Node prebuilt 4 平台（napi-rs）
    # per-platform matrix：每个 job 只产出 1 个 .node 文件并上传。
    # napi artifacts 要求所有配置 target 的 .node 同时存在，故移至 release job 执行。
    strategy:
      fail-fast: false
      matrix:
        include:
          # triples 与 crates/vane-node/napi.config.json 的 additional 一致
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_platform: linux-x64-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            node_platform: darwin-arm64
          # Z1 标注 pre-existing：macos-13（Intel）已于 2025-12 被 GitHub 退役，
          # 替换为 macos-15-intel（2025-09 上线，退役计划 2027 秋，最后一个 x86_64 镜像）。
          - os: macos-15-intel
            target: x86_64-apple-darwin
            node_platform: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_platform: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli
      - name: Build napi prebuilt
        working-directory: crates/vane-node
        run: napi build --target ${{ matrix.target }} --platform --release
      - uses: actions/upload-artifact@v4
        with:
          name: vane-node-${{ matrix.node_platform }}
          path: crates/vane-node/*.node

  build-go:
    # SPEC §12.2 Go cgo staticlib 4 平台交叉编译（zig cc）。
    # 配置与 ci.yml go-cross job 一致（已 CI 验证）：
    #   zig 0.15.2 + cargo-zigbuild 0.23.0 + Rust triple --target。
    # 产出 libvane_ffi-<lib_dir>.a，发版时作为 GitHub Release asset。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # target=Rust triple（传给 cargo zigbuild --target + 产物目录）。
          # lib_dir=bindings/go/lib/ 子目录名（cgo 约定）。
          - target: x86_64-unknown-linux-gnu
            lib_dir: linux-amd64
          - target: aarch64-unknown-linux-gnu
            lib_dir: linux-arm64
          - target: x86_64-apple-darwin
            lib_dir: darwin-amd64
          - target: aarch64-apple-darwin
            lib_dir: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.23.0
      - name: Cross-compile vane-ffi staticlib (zig cc)
        run: cargo zigbuild --release -p vane-ffi --target ${{ matrix.target }}
      - name: Verify + rename staticlib
        run: |
          test -f target/${{ matrix.target }}/release/libvane_ffi.a
          cp target/${{ matrix.target }}/release/libvane_ffi.a libvane_ffi-${{ matrix.lib_dir }}.a
          ls -lh libvane_ffi-${{ matrix.lib_dir }}.a
      - uses: actions/upload-artifact@v4
        with:
          name: vane-go-${{ matrix.lib_dir }}
          path: libvane_ffi-${{ matrix.lib_dir }}.a

  build-wasm:
    # SPEC §12.2/§13.2-3 浏览器 WASM 双变体（simd128 + scalar）。
    # 复用 scripts/build-wasm-variants.sh（含 wasm-opt -Oz + 体积门禁 gzip ≤800KB）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen
      - name: Build WASM dual variants (simd + scalar)
        run: FEATURES=worker bash scripts/build-wasm-variants.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vane-wasm
          path: |
            target/wasm-variants/vane_wasm_simd.wasm
            target/wasm-variants/vane_wasm_scalar.wasm

  release:
    # 三端 prebuilt 聚合发布。
    # Node 流水线（@napi-rs/cli 3.8.5）：
    #   1. 下载 4 平台 .node → 放回 crates/vane-node/（napi build 默认产出位置）
    #   2. napi artifacts --output-dir . --npm-dir npm：收集 4 .node 到 npm/ 平台包目录
    #   3. napi pre-publish -t npm --no-gh-release：更新 package.json + 复制 addon +
    #      自动 npm publish 4 个 optionalDeps 平台包（@vane-rs/node-*）
    #   4. npm publish --access public：发布主包 @vane-rs/node（pre-publish 不发布根包）
    # Go .a + WASM .wasm 作为 GitHub Release assets（softprops/action-gh-release）。
    # tag 触发：npm publish + GitHub Release。workflow_dispatch：仅构建 + artifacts 收集验证，跳过 publish/release。
    needs: [build, build-go, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage node .node files into crates/vane-node
        # napi build 默认产出 .node 到 crate folder；artifacts --output-dir . 从 cwd 递归扫描。
        # 把 4 平台 .node 放回 crates/vane-node/ 以满足 artifacts 对全部 target 的要求。
        run: |
          mkdir -p crates/vane-node
          cp artifacts/vane-node-*/*.node crates/vane-node/
          ls -lh crates/vane-node/*.node
      - name: Collect node artifacts into npm platform packages
        # 要求 napi.config.json 所有 4 个 triple 的 .node 同时存在（release job 已聚合）。
        # 生成 npm/<platform-arch-abi>/ 目录结构。
        working-directory: crates/vane-node
        run: napi artifacts --output-dir . --npm-dir npm
      - name: Pre-publish (publish optionalDeps platform packages)
        # napi pre-publish 自动对每个平台包执行 `npm publish`（optionalDependencies）。
        # --no-gh-release：禁用 napi 自建 GitHub Release，避免与下方 softprops 步骤冲突。
        # -t npm：tag 风格 v0.1.0（与本仓库 tag 约定一致）。
        # pre-publish 不发布根包，根包由下一步 npm publish 发布。
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: crates/vane-node
        run: napi pre-publish -t npm --no-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package to npm
        # pre-publish 只发布 optionalDeps 平台包；主包 @vane-rs/node 需单独发布。
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: crates/vane-node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release + attach Go/WASM assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vane-go-*/libvane_ffi-*.a
            artifacts/vane-wasm/*.wasm
