name: release

on:
  push:
    tags:
      - 'v*' # 仅 tag 触发正式发版
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.1）'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # SPEC §12.2 M0 Node prebuilt 4 平台（napi-rs，@napi-rs/cli 2.x）。
    # 官方发布流程 build job：per-platform 只 `napi build --target` 产出 .node 并上传，
    # 不在此跑 `napi artifacts`（2.x/3.x 均不支持 `napi artifacts --target`）。
    # 平台包聚合交给 release job 的 `napi create-npm-dir` + `napi artifacts`。
    strategy:
      fail-fast: false
      matrix:
        include:
          # triples 与 crates/vane-node/package.json napi.triples.additional 一致
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_platform: linux-x64-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            node_platform: darwin-arm64
          # Z1 标注 pre-existing：macos-13（Intel）已于 2025-12 被 GitHub 退役，
          # 替换为 macos-15-intel（2025-09 上线，退役计划 2027 秋，最后一个 x86_64 镜像）。
          - os: macos-15-intel
            target: x86_64-apple-darwin
            node_platform: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_platform: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli@^2.18.0
      - name: Build napi prebuilt
        working-directory: crates/vane-node
        run: napi build --target ${{ matrix.target }} --platform --release
      - uses: actions/upload-artifact@v4
        with:
          name: vane-node-${{ matrix.node_platform }}
          path: |
            crates/vane-node/*.node
            crates/vane-node/index.js

  build-go:
    # SPEC §12.2 Go cgo staticlib 4 平台交叉编译（zig cc）。
    # 配置与 ci.yml go-cross job 一致（已 CI 验证）：
    #   zig 0.15.2 + cargo-zigbuild 0.23.0 + Rust triple --target。
    # 产出 libvane_ffi-<lib_dir>.a，发版时作为 GitHub Release asset。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # target=Rust triple（传给 cargo zigbuild --target + 产物目录）。
          # lib_dir=bindings/go/lib/ 子目录名（cgo 约定）。
          - target: x86_64-unknown-linux-gnu
            lib_dir: linux-amd64
          - target: aarch64-unknown-linux-gnu
            lib_dir: linux-arm64
          - target: x86_64-apple-darwin
            lib_dir: darwin-amd64
          - target: aarch64-apple-darwin
            lib_dir: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.23.0
      - name: Cross-compile vane-ffi staticlib (zig cc)
        run: cargo zigbuild --release -p vane-ffi --target ${{ matrix.target }}
      - name: Verify + rename staticlib
        run: |
          test -f target/${{ matrix.target }}/release/libvane_ffi.a
          cp target/${{ matrix.target }}/release/libvane_ffi.a libvane_ffi-${{ matrix.lib_dir }}.a
          ls -lh libvane_ffi-${{ matrix.lib_dir }}.a
      - uses: actions/upload-artifact@v4
        with:
          name: vane-go-${{ matrix.lib_dir }}
          path: libvane_ffi-${{ matrix.lib_dir }}.a

  build-wasm:
    # SPEC §12.2/§13.2-3 浏览器 WASM 双变体（simd128 + scalar）。
    # 复用 scripts/build-wasm-variants.sh（含 wasm-opt -Oz + 体积门禁 gzip ≤800KB）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen
      - name: Build WASM dual variants (simd + scalar)
        run: FEATURES=worker bash scripts/build-wasm-variants.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vane-wasm
          path: |
            target/wasm-variants/vane_wasm_simd.wasm
            target/wasm-variants/vane_wasm_scalar.wasm

  release:
    # 三端 prebuilt 聚合发布。Node 流水线遵循 napi-rs 官方发布流程
    # （napi.rs/docs/deep-dive/release），与 @napi-rs/cli 2.x 命令一致：
    #   1. 下载 4 平台 .node → 暂存到 crates/vane-node/（napi artifacts 扫描位置）
    #   2. napi create-npm-dir -t .：为每个 target 创建 npm/<platform>/ 平台包目录 + package.json
    #   3. napi artifacts --dir .：从 cwd 收集 .node 拷贝到 npm/<platform>/ 与包根
    #   4. npm publish（主包）：prepublishOnly 脚本 `napi prepublish -t npm` 自动发布
    #      4 个 optionalDeps 平台包 + 上传 .node 到 GitHub Release
    # Go .a + WASM .wasm 由 softprops/action-gh-release 单独挂到同一 Release。
    # tag 触发：npm publish + GitHub Release。workflow_dispatch：仅构建 + create-npm-dir +
    # artifacts 收集验证（publish/gh-release 通过 `if: startsWith(github.ref, 'refs/tags/')` 跳过）。
    needs: [build, build-go, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli@^2.18.0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage node .node + index.js into crates/vane-node/
        # napi artifacts --dir . 从 cwd（crates/vane-node/）扫描 *.node；
        # 将 4 个 per-platform .node 暂存到此目录。
        # index.js 是 napi-rs 生成的平台切换 loader（main.js require './index.js'），
        # 被 .gitignore 忽略不入库，需从 build artifact 暂存（4 平台生成相同文件，取 linux 即可）。
        run: |
          cp artifacts/vane-node-*/*.node crates/vane-node/
          cp artifacts/vane-node-linux-x64-gnu/index.js crates/vane-node/
          ls -lh crates/vane-node/*.node crates/vane-node/index.js
      - name: Create npm platform package dirs
        # 2.x 命令为 `create-npm-dir`（单数）；为 napi.triples.additional 的每个 target
        # 创建 npm/<platform>/ + package.json（main 指向 <binaryName>.<platform>.node）。
        # 必须在 napi artifacts 之前运行（后者只写文件，不建目录）。
        working-directory: crates/vane-node
        run: napi create-npm-dir -t .
      - name: Collect .node into platform packages
        # 2.x napi artifacts 选项：[-d,--dir] [--dist] [-c,--config]。
        # --dir . 指向 cwd（.node 所在），--dist 默认 npm（上一步创建的目录）。
        # 收集 .node 到 npm/<platform>/ 与包根。
        working-directory: crates/vane-node
        run: napi artifacts --dir .
      - name: Publish to npm
        # npm publish 主包触发 prepublishOnly 脚本 `napi prepublish -t npm`：
        # 更新 optionalDependencies → 逐个 npm publish npm/<platform>/ 平台包 →
        # 上传 .node 到 GitHub Release（需 GITHUB_TOKEN + GITHUB_REPOSITORY，后者 Actions 自动注入）。
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: crates/vane-node
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release + attach Go/WASM assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vane-go-*/libvane_ffi-*.a
            artifacts/vane-wasm/*.wasm
