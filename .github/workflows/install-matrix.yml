name: install-matrix

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: '@vane-rs/node 版本号'
        required: true
        default: '0.2.0'

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        pkg_manager: [npm, yarn, pnpm, bun]
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # 注：bun 在 windows 上的支持仍在演进，该组合为软门禁（报警但不阻断）。
    # SPEC §13.2-4：npm/yarn/pnpm × 三平台 + bun × (linux+macos) 共 11 个组合硬通过。
    continue-on-error: ${{ matrix.os == 'windows-latest' && matrix.pkg_manager == 'bun' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pkg manager
        shell: bash
        run: |
          case "${{ matrix.pkg_manager }}" in
            npm)  npm --version ;;
            yarn) corepack enable; yarn --version ;;
            pnpm) npm install -g pnpm; pnpm --version ;;
            bun)  curl -fsSL https://bun.sh/install | bash; echo "$HOME/.bun/bin" >> $GITHUB_PATH; export PATH="$HOME/.bun/bin:$PATH"; bun --version ;;
          esac
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # workflow_dispatch 显式传参优先；否则从 crates/vane-node/package.json 读取
          # （workflow_run 触发时 github.event.inputs 为空，此前硬编码回退 '0.1.0'
          # 会与已发布版本脱节）。
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./crates/vane-node/package.json').version")
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Init test project
        shell: bash
        run: |
          mkdir test-install && cd test-install
          case "${{ matrix.pkg_manager }}" in
            npm)  npm init -y; npm install @vane-rs/node@${{ steps.ver.outputs.version }} ;;
            yarn) yarn init -y; echo 'nodeLinker: node-modules' > .yarnrc.yml; yarn add @vane-rs/node@${{ steps.ver.outputs.version }} ;;
            pnpm) pnpm init; pnpm add @vane-rs/node@${{ steps.ver.outputs.version }} ;;
            bun)  bun init -y; bun add @vane-rs/node@${{ steps.ver.outputs.version }} ;;
          esac
      - name: Require and smoke test
        shell: bash
        run: |
          cd test-install
          node -e "const vane = require('@vane-rs/node'); console.log('loaded:', typeof vane); if (typeof vane.open !== 'function' && typeof vane.VaneDb === 'undefined') { console.error('FAIL: no open/VaneDb export'); process.exit(1); } console.log('OK')"
