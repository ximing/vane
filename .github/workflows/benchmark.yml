name: benchmark

on:
  schedule:
    - cron: '0 3 * * *' # 每日 UTC 03:00（北京时间 11:00）
  workflow_dispatch: # 支持手动触发

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史以对比 main
      - uses: dtolnay/rust-toolchain@stable
      - name: Install critcmp
        run: cargo install critcmp --locked
      - name: Record trigger ref
        id: ref
        run: echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
      # FF5 修复：两个 baseline 必须落在同一 target/criterion 才能被 critcmp 比较。
      # 此前用 git worktree 在对侧目录跑 main，baseline 隔离在各自 worktree 的
      # target/criterion，repo 根 critcmp 读不到 → 回退门禁实际失效。
      # 现改为同一 checkout 内顺序切分支：main 先 --save-baseline main，
      # 再切回触发分支 --save-baseline current，两者共享 target/criterion。
      - name: Checkout main and run baseline bench
        run: |
          git fetch origin main:main
          git checkout main
          cargo bench --workspace -- --save-baseline main
      - name: Checkout trigger branch and run current bench
        run: |
          git checkout "${{ steps.ref.outputs.branch }}"
          cargo bench --workspace -- --save-baseline current
      - name: Compare and fail on >10% regression
        run: |
          # critcmp 退出码在 baseline 缺失等情况下不可靠，故 || true 兜底；
          # 真正的回退判定交给 check-bench-regression.py 解析其表格输出。
          critcmp main current > compare.txt 2>&1 || true
          cat compare.txt
          python3 scripts/check-bench-regression.py compare.txt 0.10
      - name: Upload comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-comparison
          path: compare.txt
